plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'com.pro.gallery'
    compileSdk 34

    defaultConfig {
        applicationId "com.pro.gallery"
        minSdk 29
        targetSdk 29
        versionCode 2
        versionName "2.0"
    }

    buildFeatures { buildConfig false }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with the debug key so the release APK installs directly.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xno-param-assertions', '-Xno-call-assertions', '-Xno-receiver-assertions']
    }

    lint { abortOnError false; checkReleaseBuilds false }

    packaging {
        resources {
            excludes += ['/META-INF/*.version', '/kotlin/**', '/kotlin-tooling-metadata.json', 'DebugProbesKt.bin']
        }
    }

    dependenciesInfo { includeInApk = false; includeInBundle = false }
}

dependencies {
    // The only library: RecyclerView. No Glide, AppCompat, Material, ViewPager2 or core-ktx.
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
